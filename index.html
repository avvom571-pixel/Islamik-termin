<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аҳли Сунна Илмлари, Терминлари ва Манбалари Платформаси</title>
<style>
:root{--primary:#0f5132;--secondary:#198754;--accent:#d4af37;--bg:#f8f9fa;--card:#fff;--text:#212529;--muted:#6c757d;--border:#e0e0e0;--soft:#f1f8f5;--chip:#e9ecef;--input:#fff;--foot:#f8f9fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#0b3d28;--secondary:#1f9d63;--accent:#e2c25a;--bg:#121614;--card:#1c221f;--text:#e8ece9;--muted:#9aa5a0;--border:#2e3733;--soft:#18241e;--chip:#2a322e;--input:#1c221f;--foot:#171c19;color-scheme:dark}}
:root[data-theme="dark"]{--primary:#0b3d28;--secondary:#1f9d63;--accent:#e2c25a;--bg:#121614;--card:#1c221f;--text:#e8ece9;--muted:#9aa5a0;--border:#2e3733;--soft:#18241e;--chip:#2a322e;--input:#1c221f;--foot:#171c19;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);line-height:1.6}
header{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:2.5rem 1rem;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,.1)}
header h1{font-size:clamp(1.4rem,4.5vw,2.2rem);margin-bottom:.5rem;color:var(--accent)}
header p{font-size:1.05rem;opacity:.9;max-width:760px;margin:0 auto}
.container{max-width:1200px;margin:2rem auto;padding:0 1rem}
.tab-nav{display:flex;justify-content:center;gap:.8rem;margin-bottom:1.5rem;flex-wrap:wrap}
.tab-btn{background:var(--chip);border:2px solid var(--primary);padding:.7rem 1.6rem;border-radius:30px;cursor:pointer;font-weight:700;font-size:1.05rem;color:var(--text);transition:.25s}
.tab-btn.active,.tab-btn:hover{background:var(--primary);color:#fff}
.controls{background:var(--card);padding:1.25rem;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.06);margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;border:1px solid var(--border)}
.search-box{flex:1;min-width:220px}
.search-box input,.fld{width:100%;padding:.7rem;border:1px solid var(--border);border-radius:6px;font-size:1rem;background:var(--input);color:var(--text)}
.filter-group{display:flex;gap:.5rem;flex-wrap:wrap}
.filter-btn{background:var(--chip);color:var(--text);border:none;padding:.5rem 1.1rem;border-radius:20px;cursor:pointer;font-weight:600;transition:.25s}
.filter-btn.active,.filter-btn:hover{background:var(--secondary);color:#fff}
.count{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(350px,100%),1fr));gap:1.5rem}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.06);border:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 15px rgba(0,0,0,.12)}
.card-header{background:var(--primary);color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.card-header h3{font-size:1.15rem;color:var(--accent)}
.badge{background:rgba(255,255,255,.2);padding:.2rem .6rem;border-radius:12px;font-size:.8rem;white-space:nowrap}
.card-body{padding:1.2rem;flex-grow:1}
.info{background:var(--soft);border-left:4px solid var(--secondary);padding:.8rem;margin:.6rem 0;border-radius:0 6px 6px 0}
.info h4{color:var(--secondary);font-size:.95rem;margin-bottom:.3rem}
.info p{font-size:.9rem;color:var(--muted)}
.card-body p{font-size:.92rem;margin-bottom:.4rem}
.card-body strong{color:var(--secondary)}
.tm{margin-bottom:.7rem}
.card-footer{padding:.8rem 1rem;background:var(--foot);border-top:1px solid var(--border);font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.btn{background:var(--secondary);color:#fff;border:none;padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:.9rem;text-decoration:none;display:inline-block}
.btn.alt{background:var(--chip);color:var(--text)}
.empty{grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)}
.hidden{display:none!important}
footer{text-align:center;padding:2rem 1rem;background:var(--primary);color:#fff;margin-top:3rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + .8rem) .8rem calc(env(safe-area-inset-bottom,0px) + .8rem)}
.sheet{background:var(--card);color:var(--text);border-radius:14px;width:100%;max-width:900px;max-height:100%;overflow:auto;border:1px solid var(--border)}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:var(--primary);color:#fff;position:sticky;top:0}
.sh-head h3{color:var(--accent);font-size:1.15rem}
.x{background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;line-height:1}
.sh-body{padding:1rem}
.sh-body h4{margin:1rem 0 .5rem;color:var(--secondary)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
.row .fld{flex:1;min-width:200px}
iframe{width:100%;height:65vh;border:1px solid var(--border);border-radius:8px;margin-top:.6rem;background:#fff}
.note{font-size:.82rem;color:var(--muted);margin-top:.4rem}
.tab-btn{padding:.5rem 1rem;font-size:.92rem}
.full{grid-column:1/-1}
.opt{display:block;width:100%;text-align:left;margin:.4rem 0;background:var(--chip);color:var(--text);border:2px solid transparent;padding:.7rem;border-radius:8px;cursor:pointer;font-size:1rem}
.opt.ok{border-color:#198754;background:#d1e7dd;color:#0f5132}.opt.bad{border-color:#dc3545;background:#f8d7da;color:#842029}
.lk{background:none;border:none;color:var(--secondary);cursor:pointer;text-align:left;font-size:.92rem;padding:.15rem 0;text-decoration:underline}
.sel{display:flex;gap:.5rem;flex-wrap:wrap;width:100%}.sel select{padding:.5rem;border-radius:6px;border:1px solid var(--border);background:var(--input);color:var(--text)}
@media print{.controls,.tab-nav,.btn,#tools,.modal,footer,.sel{display:none!important}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header>
  <h1>Аҳли Сунна Илмлари, Терминлари ва Манбалари</h1>
  <p>Исломий фанлар, манбалар, муаллифлар таржимаи ҳоли ва шаръий терминлар электрон платформаси</p>
</header>
<div class="container">
  <div class="tab-nav">
    <button class="tab-btn active" id="t0" onclick="switchTab('books')">📚 Фанлар ва Манбалар</button>
    <button class="tab-btn" id="t1" onclick="switchTab('terms')">📖 Исломий Терминлар</button>
  </div>
  <div class="controls">
    <div class="search-box"><input type="search" id="q" placeholder="Қидириш (Ақида, Рўза, Имом Бухорий, Ихлос)..." oninput="render()"></div>
    <div class="filter-group" id="filters"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>
<footer><p>© Аҳли Сунна вал Жамоа Мўътабар Илмлар ва Терминлар Энциклопедияси</p></footer>
<div class="modal hidden" id="modal" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>

<script>
const books=[
{title:"Ақидатут-Тоҳовий",category:"Ақида",level:"Бошланғич",author:"Имом Абу Жаъфар ат-Тоҳовий",authorBio:"ҳ.и. 239–321 / м. 853–933. Мисрнинг Тоҳо қишлоғида туғилган. Ҳанафий мазҳабининг буюк муҳаддиси ва фақиҳи.",description:"Аҳли сунна вал жамоа ақидасининг энг мукаммал, ихчам ва саҳобаларнинг эътиқодини ифодалаган шоҳ асар.",language:"Арабча / Ўзбекча шарҳлари мавжуд",q:"Ақидатут Таҳовия"},
{title:"Шарҳул-Ақоидин-Насафиййа",category:"Ақида",level:"Юқори",author:"Имом Саъдуддин Тафтазоний",authorBio:"ҳ.и. 722–792 / м. 1322–1390. Хоразм яқинидаги Тафтазон қишлоғида туғилган. Калом, балоғат ва мантиқ султони.",description:"Мотуридия ва Ашъария ақидасини ақлий ва нақлий далиллар билан чуқур асослаб берган фундаментал манба.",language:"Арабча (Шарҳлар билан)",q:"Шарҳул Ақоид ан-Насафия"},
{title:"Китобут-Тавҳид",category:"Ақида",level:"Олий",author:"Имом Абу Мансур ал-Мотуридий",authorBio:"ваф. ҳ.и. 333 / м. 944. Самарқандлик буюк мутакаллим, Мотуридия ақидавий мактабининг асосчиси.",description:"Мотуридия калом илмининг асосий манбаи бўлиб, Аллоҳнинг борлиғи ва сифатлари ақлий ва нақлий далиллар билан ёритилган.",language:"Арабча",q:"Китаб ат-Тавхид аль-Матуриди"},
{title:"Мухтасарул-Қудурий",category:"Фиқҳ",level:"Бошланғич",author:"Абул Ҳасан ал-Қудурий",authorBio:"ҳ.и. 362–428 / м. 973–1037. Бағдодлик буюк ҳанафий фақиҳи.",description:"Ҳанафий фиқҳининг бошланғич даражадаги энг машҳур матни (12,000 га яқин амалий масалаларни ўз ичига олади).",language:"Арабча / Таржима қилинган",q:"Мухтасар аль-Кудури"},
{title:"Нурул-Изоҳ",category:"Фиқҳ",level:"Бошланғич",author:"Ҳасан аш-Шурунбулолий",authorBio:"ҳ.и. 994–1069 / м. 1585–1659. Мисрда яшаган ҳанафий фақиҳи.",description:"Ибодатлар бобини содда ва аниқ баён қилган, ҳанафий мадрасаларида кенг ўқитиладиган ихчам фиқҳ матни.",language:"Арабча / Таржима қилинган",q:"Нур аль-идах"},
{title:"Ал-Ҳидоя",category:"Фиқҳ",level:"Юқори",author:"Бурҳониддин ал-Марғиноний",authorBio:"ҳ.и. 511–593 / м. 1117–1197. Фарғонанинг Марғилон шаҳрида туғилган буюк имом ва фақиҳ.",description:"Ислом оламида 'Шарқ ва Ғарб фиқҳининг шоҳ асарларидан бири' деб тан олинган мазҳаб далиллари чуқур асар.",language:"Арабча (Кўп жилдлик шарҳлар)",q:"Аль-Хидая аль-Маргинани"},
{title:"Саҳиҳул-Бухорий",category:"Ҳадис",level:"Олий",author:"Имом Муҳаммад ибн Исмоил ал-Бухорий",authorBio:"ҳ.и. 194–256 / м. 810–870. Бухоро шаҳрида туғилган. Ислом оламидаги энг буюк муҳаддис.",description:"Қуръони Каримдан кейинги энг ишончли ва саҳиҳ деб тан олинган ҳадислар тўплами.",language:"Арабча / Ўзбекча тўлиқ таржимаси мавжуд",q:"Сахих аль-Бухари"},
{title:"Саҳиҳу Муслим",category:"Ҳадис",level:"Олий",author:"Имом Муслим ибн ал-Ҳажжож",authorBio:"ҳ.и. 206–261 / м. 821–875. Нишопурда туғилган буюк муҳаддис.",description:"Бухорийдан кейинги иккинчи энг саҳиҳ ҳадислар тўплами, ҳадислари мавзулар бўйича тартибланган.",language:"Арабча / Таржима қилинган",q:"Сахих Муслим"},
{title:"Риёзус-Солиҳийн",category:"Ҳадис",level:"Ўрта",author:"Имом Муҳийиддин Яҳё ан-Нававий",authorBio:"ҳ.и. 631–676 / м. 1233–1277. Шомдаги Нава қишлоғида туғилган. Шофиъий мазҳабининг йирик олими.",description:"Оила, ахлоқ, ибодат ва руҳий покланишга оид ҳадислар жамланган оммабоп китоб.",language:"Арабча / Ўзбекча таржимаси кенг тарқалган",q:"Рийад ас-салихин"},
{title:"Тафсирул-Жалолайн",category:"Тафсир",level:"Бошланғич",author:"Жалолуддин ал-Маҳаллий ва Жалолуддин аш-Суютий",authorBio:"Мисрлик икки буюк олим (XV аср). Қуръон ва ҳадис илмларида беназир.",description:"Қуръони Карим оятларини жуда ихчам изоҳлаб берган тафсир.",language:"Арабча",q:"Тафсир аль-Джалалайн"},
{title:"Тафсири Ибн Касир",category:"Тафсир",level:"Юқори",author:"Имодуддин Ибн Касир ад-Димашқий",authorBio:"ҳ.и. 700–774 / м. 1301–1373. Дамашқлик тарихчи, муҳаддис ва тафсирчи олим.",description:"Қуръонни Қуръон ва саҳиҳ ҳадислар билан тафсир қилишдаги (тафсир бил-маъсур) энг ишончли манбалардан.",language:"Арабча / Кўп тилларга таржима қилинган",q:"Тафсир Ибн Касир"},
{title:"Иҳёу Улумид-Дин",category:"Тасаввуф",level:"Юқори",author:"Имом Абу Ҳомид ал-Ғаззолий",authorBio:"ҳ.и. 450–505 / м. 1058–1111. Эроннинг Тус шаҳрида туғилган. 'Ҳужжатул Ислом' унвони соҳиби.",description:"Фиқҳ ва руҳий тарбияни бирлаштирган, нафс касалликлари ва давосини кўрсатган энциклопедик асар.",language:"Арабча / Таржима қилинган",q:"Ихъя улум ад-дин"},
{title:"Ар-Рисолатул-Қушайриййа",category:"Тасаввуф",level:"Ўрта",author:"Имом Абул Қосим ал-Қушайрий",authorBio:"ҳ.и. 376–465 / м. 986–1072. Нишопурлик суфий, муҳаддис ва фақиҳ олим.",description:"Аҳли сунна тасаввуфининг асосий манбаларидан, тариқат аҳлининг Шариатга амал қилишини далиллайди.",language:"Арабча",q:"Ар-Рисала аль-Кушайрия"},
{title:"Ал-Фиқҳул-Акбар",category:"Ақида",level:"Бошланғич",author:"Имом Аъзам Абу Ҳанифа",authorBio:"ҳ.и. 80–150 / м. 699–767. Куфада туғилган, Ҳанафий мазҳабининг асосчиси.",description:"Ақида масалаларига бағишланган энг қадимги ихчам рисолалардан бири, Аҳли сунна ақидасининг асосларини баён қилади.",language:"Арабча",q:"Фикх аль-акбар Абу Ханифа"},
{title:"Ал-Ақоидун-Насафиййа",category:"Ақида",level:"Ўрта",author:"Нажмуддин Умар ан-Насафий",authorBio:"ҳ.и. 461–537 / м. 1068–1142. Самарқандлик ҳанафий фақиҳи ва мутакаллим.",description:"Мотуридия ақидасини ихчам баён қилган матн; кейинчалик Тафтазоний унга машҳур шарҳ ёзган.",language:"Арабча",q:"Акаид ан-Насафи"},
{title:"Бадъул-Амали",category:"Ақида",level:"Бошланғич",author:"Али ибн Усмон ал-Уший",authorBio:"ваф. ҳ.и. 575 / м. 1179. Фарғонанинг Уш шаҳрида яшаган олим.",description:"Ақида масалалари назмда баён қилинган, Марказий Осиё мадрасаларида ёд олинган қасида.",language:"Арабча",q:"Бад аль-амали аль-уши"},
{title:"Ал-Иқтисод фил-Эътиқод",category:"Ақида",level:"Юқори",author:"Имом Абу Ҳомид ал-Ғаззолий",authorBio:"ҳ.и. 450–505 / м. 1058–1111. Тус шаҳрида туғилган.",description:"Ақида масалаларининг ақлий далиллари ва ўрта йўл (эътидол) тамойили баён қилинган калом асари.",language:"Арабча",q:"Аль-иктисад фи аль-итикад Газали"},
{title:"Бидоятул-Мубтадий",category:"Фиқҳ",level:"Бошланғич",author:"Бурҳониддин ал-Марғиноний",authorBio:"ҳ.и. 511–593 / м. 1117–1197. Марғилонлик буюк фақиҳ.",description:"Ҳидоя китобининг матни; ҳанафий фиқҳининг асосий масалалари ихчам тартибда берилган.",language:"Арабча",q:"Бидаят аль-мубтади Маргинани"},
{title:"Ал-Мабсут",category:"Фиқҳ",level:"Олий",author:"Шамсул-аимма ас-Сарахсий",authorBio:"ваф. ҳ.и. 483 / м. 1090. Сарахсда туғилган, Бухорода таълим олган; Узжандда зиндонда туриб китобни диктовка қилгани машҳур.",description:"Ҳанафий фиқҳининг энг кенг қамровли асарларидан бири, кўп жилдли.",language:"Арабча",q:"Аль-Мабсут Сарахси"},
{title:"Канзуд-Дақоиқ",category:"Фиқҳ",level:"Ўрта",author:"Абул-Баракот ан-Насафий",authorBio:"ваф. ҳ.и. 710 / м. 1310. Ҳанафий мазҳабининг йирик фақиҳи ва мутакаллими.",description:"Ҳанафий фиқҳининг машҳур ўрта даражадаги матни, кўплаб шарҳлари бор.",language:"Арабча",q:"Канз ад-дака'ик Насафи"},
{title:"Радул-Муҳтор (Ҳошияту Ибн Обидин)",category:"Фиқҳ",level:"Олий",author:"Муҳаммад Амин Ибн Обидин",authorBio:"ҳ.и. 1198–1252 / м. 1784–1836. Дамашқлик ҳанафий фақиҳи.",description:"Кейинги давр ҳанафий фатволарининг асосий маълумотномаси бўлган ҳошия.",language:"Арабча",q:"Хашия Ибн Абидин Рад аль-мухтар"},
{title:"Ал-Вараққот",category:"Усулул-фиқҳ",level:"Бошланғич",author:"Имомул-Ҳарамайн ал-Жувайний",authorBio:"ҳ.и. 419–478 / м. 1028–1085. Нишопурлик шофиъий олими, Ғаззолийнинг устози.",description:"Фиқҳ усулига кириш бўлган ихчам рисола, олимлар орасида кенг шарҳланган.",language:"Арабча",q:"Аль-Вараках Джувейни усуль"},

let tab='books',cat='Барчаси';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

function switchTab(t){tab=t;cat='Барчаси';$('t0').classList.toggle('active',t==='books');$('t1').classList.toggle('active',t==='terms');render()}

function filters(){
  const src=tab==='books'?books:terms;
  const cats=['Барчаси',...new Set(src.map(i=>i.category))];
  $('filters').innerHTML='';
  cats.forEach(c=>{const b=document.createElement('button');b.className='filter-btn'+(c===cat?' active':'');b.textContent=c;b.onclick=()=>{cat=c;render()};$('filters').appendChild(b)});
}

function render(){
  filters();
  const q=$('q').value.toLowerCase().trim();
  let html='',n=0;
  if(tab==='books'){
    books.forEach((b,i)=>{
      if((cat==='Барчаси'||b.category===cat)&&(b.title+b.author+b.category).toLowerCase().includes(q)){n++;
      html+=`<div class="card"><div class="card-header"><h3>${esc(b.title)}</h3><span class="badge">${esc(b.level)}</span></div>
      <div class="card-body"><div class="info"><h4>✍️ Муаллиф: ${esc(b.author)}</h4><p><strong>Таржимаи ҳоли:</strong> ${esc(b.authorBio)}</p></div>
      <p><strong>Фан соҳаси:</strong> ${esc(b.category)}</p><p><strong>Тафсилот:</strong> ${esc(b.description)}</p></div>
      <div class="card-footer"><span>🌐 ${esc(b.language)}</span><button class="btn" onclick="openBook(${i})">📄 Китобни очиш</button></div></div>`}
    });
  }else{
    terms.forEach(t=>{
      if((cat==='Барчаси'||t.category===cat)&&(t.term+t.category+t.idio+t.ling).toLowerCase().includes(q)){n++;
      html+=`<div class="card"><div class="card-header"><h3>${esc(t.term)}</h3><span class="badge">${esc(t.category)}</span></div>
      <div class="card-body"><div class="tm"><strong>1. Луғавий маъноси:</strong><p>${esc(t.ling)}</p></div>
      <div class="tm"><strong>2. Истилоҳий (шаръий) маъноси:</strong><p>${esc(t.idio)}</p></div>
      <div class="info"><h4>🌿 3. Тасаввуфий (маънавий) маъноси:</h4><p>${esc(t.sufi)}</p></div></div></div>`}
    });
  }
  $('count').textContent='Топилди: '+n+' та';
  $('grid').innerHTML=html||'<p class="empty">Маълумот топилмади.</p>';
}

/* ---------- Book modal with PDF reader ---------- */
let blobUrl='';
function openBook(i){
  const b=books[i],key='pdf:'+b.title,saved=lsGet(key);
  const enc=encodeURIComponent;
  const links=[
    ['🔎 Internet Archive (кутубхона)',`https://archive.org/search?query=${enc(b.q)}`],
    ['🔎 PDF қидириш (Google)',`https://www.google.com/search?q=${enc(b.q+' filetype:pdf')}`],
    ['🔎 Ўзбекча PDF қидириш',`https://www.google.com/search?q=${enc(b.title+' ўзбекча pdf')}`]
  ];
  if(b.category==='Ҳадис')links.push(['📚 hadis.islom.uz (ҳадис манбаси)','https://hadis.islom.uz']);
  links.push(['📚 IslamHouse (Ўзбекча китоблар)','https://islamhouse.com/uz/']);
  $('sheet').innerHTML=`<div class="sh-head"><h3>${esc(b.title)}</h3><button class="x" onclick="closeM()" aria-label="Ёпиш">×</button></div>
  <div class="sh-body"><p><strong>${esc(b.author)}</strong> — ${esc(b.description)}</p>
  <h4>📄 PDF ўқиш</h4>
  <div class="row"><input class="fld" id="pdfUrl" placeholder="PDF ҳаволасини қўйинг (https://...pdf)" value="${esc(saved)}"><button class="btn" onclick="loadUrl(${i})">Очиш</button></div>
  <div class="row"><input class="fld" type="file" id="pdfFile" accept="application/pdf" onchange="loadFile()"></div>
  <p class="note">Ҳавола ёки қурилмангиздаги PDF файлни танланг. Ҳавола шу китоб учун эслаб қолинади. Баъзи сайтлар ичида кўрсатишга рухсат бермайди — унда «янги ойнада очиш» тугмасидан фойдаланинг.</p>
  <div id="viewer"></div>
  <h4>🔗 Ишончли кутубхоналардан излаш</h4>
  <div class="row">${links.map(l=>`<a class="btn alt" href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]}</a>`).join('')}</div></div>`;
  $('modal').classList.remove('hidden');
  if(saved)show(saved);
}
function show(u){
  $('viewer').innerHTML=`<iframe src="${esc(u)}" title="PDF"></iframe><div class="row"><a class="btn alt" href="${esc(u)}" target="_blank" rel="noopener noreferrer">↗ Янги ойнада очиш</a></div>`;
}
function loadUrl(i){
  const u=$('pdfUrl').value.trim();
  if(!/^https?:\/\//i.test(u)){alert('Тўғри ҳавола киритинг (https:// билан бошланиши керак)');return}
  lsSet('pdf:'+books[i].title,u);show(u);
}
function loadFile(){
  const f=$('pdfFile').files[0];if(!f)return;
  if(blobUrl)URL.revokeObjectURL(blobUrl);
  blobUrl=URL.createObjectURL(f);show(blobUrl);
}
function closeM(){$('modal').classList.add('hidden');$('sheet').innerHTML='';if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=''}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
